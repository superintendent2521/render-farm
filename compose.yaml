name: blend-farm

x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  volumes:
    - farm-data:/data
  networks: [farm-internal]
  expose: ["8000"]

services:
  app:
    <<: *app

  nginx-direct:
    profiles: [direct]
    build:
      context: deploy/nginx
      dockerfile: Dockerfile.direct
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-farm.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-web:/var/www/certbot
    depends_on:
      app:
        condition: service_healthy
    networks: [farm-internal]

  certbot:
    profiles: [direct]
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-farm.example.com}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-admin@example.com}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-web:/var/www/certbot
    entrypoint: ["/bin/sh", "/scripts/certbot-loop.sh"]
    configs:
      - source: certbot_loop
        target: /scripts/certbot-loop.sh
    depends_on: [nginx-direct]

  nginx-tunnel:
    profiles: [cloudflare]
    build:
      context: deploy/nginx
      dockerfile: Dockerfile.tunnel
    restart: unless-stopped
    ports:
      - "${LAN_BIND:-127.0.0.1}:${LAN_PORT:-8443}:443"
    depends_on:
      app:
        condition: service_healthy
    networks: [farm-internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-not-configured}"]
    depends_on:
      nginx-tunnel:
        condition: service_healthy
    networks: [farm-internal]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  farm-data:
  letsencrypt:
  certbot-web:

networks:
  farm-internal:

configs:
  certbot_loop:
    file: ./deploy/certbot-loop.sh
