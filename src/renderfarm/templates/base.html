<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf|default('') }}">
  <title>{% block title %}Blend Farm{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body hx-boost="true">
  <header class="topbar">
    <a class="brand" href="/">Blend Farm</a>
    {% if csrf %}
    <form method="post" action="/logout?csrf={{ csrf }}"><button class="quiet">Log out</button></form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="/static/app.js"></script>
</body>
</html>
